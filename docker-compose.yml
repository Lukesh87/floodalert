version: '3.8'

services:
  # Database Service (PostgreSQL with PostGIS extensions)
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: flood_postgis
    environment:
      POSTGRES_DB: flood_db
      POSTGRES_USER: flood_admin
      POSTGRES_PASSWORD: flood_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood_admin -d flood_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flood_backend
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+psycopg2://flood_admin:flood_secure_pass@postgres:5432/flood_db
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flood_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
